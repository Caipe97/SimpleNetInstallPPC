<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>SimpleNetInstallPPC</title>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd6e0"/>
      <stop offset="0.55" stop-color="#1aa7b8"/>
      <stop offset="1" stop-color="#0b7d8f"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbfc"/>
      <stop offset="1" stop-color="#cfe6ea"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3b5563"/>
      <stop offset="1" stop-color="#16232b"/>
    </radialGradient>
  </defs>

  <!-- network cable: from the back of the computer down to the plug -->
  <path d="M188 120 C 228 128, 236 168, 214 196" fill="none" stroke="#c9961a" stroke-width="13" stroke-linecap="round"/>
  <path d="M188 120 C 228 128, 236 168, 214 196" fill="none" stroke="#f4c430" stroke-width="9" stroke-linecap="round"/>
  <!-- RJ45 plug -->
  <g transform="translate(214 200) rotate(32)">
    <rect x="-13" y="-6" width="26" height="12" rx="3" fill="#f4c430" stroke="#c9961a" stroke-width="2"/>
    <rect x="-15" y="4" width="30" height="30" rx="4" fill="#e8f1f3" fill-opacity="0.85" stroke="#7f9aa1" stroke-width="2.5"/>
    <rect x="-6" y="34" width="12" height="8" rx="2" fill="#e8f1f3" stroke="#7f9aa1" stroke-width="2"/>
    <g stroke="#c08a16" stroke-width="2.4" stroke-linecap="round">
      <line x1="-9" y1="24" x2="-9" y2="31"/><line x1="-4.5" y1="24" x2="-4.5" y2="31"/>
      <line x1="0" y1="24" x2="0" y2="31"/><line x1="4.5" y1="24" x2="4.5" y2="31"/>
      <line x1="9" y1="24" x2="9" y2="31"/>
    </g>
  </g>

  <!-- foot -->
  <path d="M74 196 L 162 196 L 176 222 Q 178 228 170 228 L 66 228 Q 58 228 60 222 Z" fill="#cfe6ea" stroke="#7f9aa1" stroke-width="3"/>
  <!-- translucent shell, rounder at the back like a CRT all-in-one -->
  <path d="M60 34 Q 118 16 176 34 Q 204 44 204 82 L 204 150 Q 204 196 168 204 Q 118 214 68 204 Q 32 196 32 150 L 32 82 Q 32 44 60 34 Z"
        fill="url(#shell)" stroke="#0a6676" stroke-width="3"/>
  <!-- handle slot on top -->
  <path d="M96 30 Q 118 22 140 30" fill="none" stroke="#0a6676" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- bezel -->
  <rect x="48" y="46" width="140" height="138" rx="26" fill="url(#bezel)" stroke="#8fb6bd" stroke-width="2"/>
  <!-- screen -->
  <rect x="62" y="58" width="112" height="86" rx="14" fill="url(#screen)"/>
  <!-- the NetBoot globe on the screen -->
  <g transform="translate(118 101)" fill="none" stroke="#7fe3ec" stroke-width="3.2">
    <circle r="26"/>
    <ellipse rx="11" ry="26"/>
    <line x1="-26" y1="0" x2="26" y2="0"/>
    <path d="M-22 -13 Q 0 -8 22 -13"/>
    <path d="M-22 13 Q 0 8 22 13"/>
  </g>
  <!-- glare -->
  <path d="M70 66 Q 92 60 112 62" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/>
  <!-- speaker grille and drive slot on the chin -->
  <g fill="#8fb6bd">
    <circle cx="66" cy="166" r="2"/><circle cx="72" cy="166" r="2"/><circle cx="66" cy="172" r="2"/><circle cx="72" cy="172" r="2"/>
    <circle cx="164" cy="166" r="2"/><circle cx="170" cy="166" r="2"/><circle cx="164" cy="172" r="2"/><circle cx="170" cy="172" r="2"/>
  </g>
  <rect x="96" y="164" width="44" height="6" rx="3" fill="#8fb6bd"/>
</svg>
