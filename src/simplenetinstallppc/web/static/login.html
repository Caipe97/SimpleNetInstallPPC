<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleNetInstallPPC login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><strong>SimpleNetInstallPPC</strong></header>
<main>
  <h2>Log in</h2>
  <form method="post" action="/login">
    <label>Password <input name="password" type="password" autocomplete="current-password" autofocus required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="note">It's in <code>ui-password</code> in the data folder
    (<code>sudo cat /var/lib/netboot-server/ui-password</code>).</p>
  <p class="note" id="failed" hidden>Wrong password.</p>
</main>
<script src="login.js"></script>
</body>
</html>
